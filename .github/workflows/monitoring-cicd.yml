name: Monitoring CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Validate configuration on every PR and push.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin actionlint
          actionlint --version

      - name: Run validation suite
        run: |
          chmod +x scripts/*.sh
          ./scripts/validate.sh

  # ---------------------------------------------------------------------------
  # Deploy the monitoring stack on pushes to main using the self-hosted runner
  # on the Nexora EC2 host. Never runs on pull requests.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy monitoring stack
    runs-on: [self-hosted, nexora]
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy monitoring stack
        run: |
          set -euo pipefail
          cd /opt/nexora/monitoring
          git fetch --all
          git reset --hard origin/main
          ENV_FILE=.env.deploy ./scripts/deploy.sh